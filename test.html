<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四川本地离线地图</title>
    <link rel="stylesheet" href="/Public/lib/leaflet/leaflet.css">
    <script src="/Public/lib/leaflet/leaflet.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body,
        #map {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b1120;
        }

        /* 实时 Zoom 悬浮显示 DOM 控件 */
        .zoom-badge {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 6px 14px;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
            pointer-events: none;
            user-select: none;
        }

        .zoom-label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .zoom-num {
            font-weight: 700;
            color: #38bdf8;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
        }

        /* 标记点样式 */
        .custom-point-pin {
            width: 18px;
            height: 18px;
            background: #0284c7;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(2, 132, 199, 0.8);
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- 纯净全屏地图容器 -->
    <div id="map"></div>

    <!-- 实时 Zoom 状态显示 DOM 节点 -->
    <div id="zoomIndicator" class="zoom-badge">
        <span class="zoom-label">Zoom Level</span>
        <span id="zoomValue" class="zoom-num">--</span>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // 目标项目精细矩形范围 [106.66214, 31.77465, 106.87585, 31.96320]
            const targetBounds = L.latLngBounds(
                [26.04, 97.34],
                [34.16, 108.55]
            );

            // 给目标范围外扩 30% 作为可拖拽移动的安全缓冲锁死边界
            const safeBounds = targetBounds.pad(0.3);

            const map = L.map('map', {
                zoom: 17,
                minZoom: 6,
                maxZoom: 18,
                maxBounds: safeBounds,
                maxBoundsViscosity: 1.0,
                zoomControl: true,
                attributionControl: false
            });
            // 视角定位至目标区域
            map.fitBounds(targetBounds);

            const tk = '73a87062ca36baaed0feebe7989f453a';

            // 1. 天地图矢量底图 (vec_w)
            const vecUrl = `https://t{s}.tianditu.gov.cn/vec_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=vec&STYLE=default&TILEMATRIXSET=w&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=tiles&tk=${tk}`;
            L.tileLayer(vecUrl, {
                subdomains: ['0', '1', '2', '3', '4', '5', '6', '7'],
                minZoom: 1,
                maxZoom: 18,
                attribution: '天地图'
            }).addTo(map);

            // 2. 天地图矢量注记 (cva_w)
            const cvaUrl = `https://t{s}.tianditu.gov.cn/cva_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=cva&STYLE=default&TILEMATRIXSET=w&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=tiles&tk=${tk}`;
            L.tileLayer(cvaUrl, {
                subdomains: ['0', '1', '2', '3', '4', '5', '6', '7'],
                minZoom: 1,
                maxZoom: 18
            }).addTo(map);

            const centerLatLng = [30.691294, 104.302553];

            // 先设置初始地图视角，确保 Leaflet 投影矩阵初始化完成
            map.setView(centerLatLng, 16);
            const pointIcon = L.divIcon({
                className: 'custom-point-pin',
                iconSize: [18, 18],
                iconAnchor: [9, 9]
            });
            const marker = L.marker(centerLatLng, { icon: pointIcon }).addTo(map);

            // 3. 动态更新当前 Zoom 显示
            const zoomValueEl = document.getElementById('zoomValue');

            function updateZoomDisplay() {
                const z = map.getZoom();
                zoomValueEl.textContent = Number.isInteger(z) ? z : z.toFixed(1);
            }

            updateZoomDisplay();
            map.on('zoom zoomend move', updateZoomDisplay);
        });
    </script>
</body>

</html>
